name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Recreate Android Project with Firebase
        run: |
          # Backup google-services.json જો અગાઉ હોય તો
          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          fi
          
          # જૂનું એન્ડ્રોઇડ કાઢીને નવું v2 એમ્બેડિંગ બનાવવું
          rm -rf android
          flutter create --project-name=star_india --org=com.example --platforms=android .
          
          # ગૂગલ સર્વિસિસ ફાઇલ પાછી મુકવી
          if [ -f "/tmp/google-services.json" ]; then
            cp /tmp/google-services.json android/app/google-services.json
          fi
          
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-india-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
